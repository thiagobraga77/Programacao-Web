<!DOCTYPE html>

<html>

<head>

    <title>ReceitaReact - Classes</title>

</head>

<body>

    <div id="app">



    </div>


    <script src="libs/react.js"></script>

    <script src="libs/react-dom.js"></script>

    <script src="libs/babel.js"></script>



    <script type="text/babel">



        class TabelaBebidas extends React.Component {
            render(){
                return (
                    <div>
                        <h1>{this.props.titulo}</h1>
                        <h2>{this.props.subtitulo}</h2>
                        <table id="tabela" border="1">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Marca</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>Havana</td>
                                        <td>Engenho Anísio Santiago</td>
                                        </tr>
                                    </tbody>
                            </table>
                        </div>
                )
            }
        }
        
        class Informacoes extends React.Component{
            render(){
                return(
                <div>    
                <h3>Informações de Entrega</h3>
                    <p>Entregas grátis para bebidas acima de <strong>R$50,00</strong></p>
                    <p>Tempo estimado de entrega: 30 a 45 minutos</p>
                </div>    
                )
            }
        }

        function App () {
            return(
                <div>
                <TabelaBebidas titulo="Tabela de Cana" subtitulo="Informações" />
                <Informacoes />
                    </div>
            )
        }




        ReactDOM.render(
            App()
            ,
            document.getElementById("app"))


    </script>

</body>

</html>
